name: Informe diario

on:
  schedule:
    # 06:15 UTC = 07:15 en Madrid en invierno (08:15 en verano)
    - cron: "15 6 * * *"
  workflow_dispatch: {}   # botón "Run workflow" para lanzarlo a mano

permissions:
  contents: write

concurrency:
  group: informe
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descargar partidos nuevos y generar la web
        run: python build.py --season E2026

      - name: Guardar cambios
        run: |
          git config user.name "informe-bot"
          git config user.email "informe-bot@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Informe $(date -u +%Y-%m-%d)"
            git push
          fi
